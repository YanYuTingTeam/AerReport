name: AerReport
version: 1.0.0
main: com.aermini.report.AerReport
author: AerMini

commands:
  report:
    permission: aerreport.use
    aliases: [r]
  vt:
    permission: aerreport.staff.main
    aliases: [volunteer, reports, vr]
  aerreport:
    permission: aerreport.admin
    aliases: [ar, are, areport]

permissions:
  aerreport.use:
    default: true
  aerreport.staff.main:
    default: op
  aerreport.staff.alert:
    default: op
  aerreport.admin:
    default: op
  aerreport.admin.fullreset:
    default: op

softdepend:
  - BungeeCord
  - VexView
