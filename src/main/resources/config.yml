config:
  cooldown: 3000 # 使用/report的冷却, 单位毫秒
  # 志愿者跨服传送后执行的命令（以志愿者身份执行）
  # {player} 会被替换为志愿者名, {tplayer} 会被替换为目标玩家名
  # 注意：gamemode spectator 已内置到代码中，无需在此配置
  teleport_commands:
    - '[COMMAND] matrix spectate {tplayer}'

settings:
  # 通知时间差阈值（毫秒）
  # 当志愿者切换服务器时，如果通知时间与加入时间的差值小于此阈值，则发送通知
  # 用于防止志愿者切换服务器时收到重复通知
  notify-threshold: 1000
  
  # 同一玩家对另一玩家的最大重复举报次数（在被处理前）
  # 设置为0表示不限制
  max-repeat: 3
  
  # 志愿者退出观察模式时可返回的服务器白名单
  # /volunteer leave 命令会返回到白名单中的服务器
  return-server-whitelist:
    - lobby
    - bwlobby
    - swlobby
    - afklobby
    - race
  
  # 志愿者退出观察者模式时执行的命令
  # {player} 会被替换为玩家名
  # [CONSOLE] 控制台执行
  # [COMMAND] 玩家执行（临时op权限）
  # [CMD] 玩家普通执行
  exit-observer-commands:
    - '[CONSOLE] gamemode survival {player}'

